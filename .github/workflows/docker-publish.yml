name: Container release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Build the release image
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          docker build --label "org.opencontainers.image.source=$SOURCE_URL" --label "org.opencontainers.image.revision=$REVISION" -t boke-speedtest:ci .
      - name: Start isolated test container
        run: |
          docker run -d --name boke-speedtest-ci -p 127.0.0.1:18090:8080 boke-speedtest:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18090/index-modern.html >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs boke-speedtest-ci
          exit 1
      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test packaged application
        run: npm run test:release
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs boke-speedtest-ci || true
          docker rm -f boke-speedtest-ci || true
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          tags=("sha-$REVISION")
          if [[ "$REF" == refs/tags/* ]]; then
            version="${REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
            tags+=("$version" latest)
          else
            tags+=(edge)
          fi
          for tag in "${tags[@]}"; do
            docker tag boke-speedtest:ci "$image:$tag"
            docker push "$image:$tag"
            echo "Published: \`$image:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
