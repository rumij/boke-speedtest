# Local standalone test: only accessible from this computer; no telemetry/database.
services:
  speedtest:
    image: php:8.3-apache
    ports:
      - "127.0.0.1:18088:8080"
    environment:
      MODE: standalone
      USE_NEW_DESIGN: "true"
      TELEMETRY: "false"
      WEBPORT: "8080"
    volumes:
      - .:/speedtest:ro
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/librespeed-php.ini:/usr/local/etc/php/conf.d/99-librespeed.ini:ro
    command: ["bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/index-modern.html"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
