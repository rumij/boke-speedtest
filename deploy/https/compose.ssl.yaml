# Use this file alone, in the existing Compose project directory.
services:
  speedtest:
    image: ${SPEEDTEST_IMAGE:-ghcr.io/rumij/boke-speedtest:1.2.0}
    expose:
      - "8080"
    environment:
      MODE: standalone
      USE_NEW_DESIGN: "true"
      TELEMETRY: "false"
      WEBPORT: "8080"
      BOKE_THEME_SYNC: "true"
      BOKE_THEME_INTERVAL: "300"
    restart: unless-stopped

  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx.ssl.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
      - type: bind
        source: ./certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
    depends_on:
      speedtest:
        condition: service_healthy
    restart: unless-stopped
