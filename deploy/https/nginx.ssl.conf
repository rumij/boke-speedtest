# Docker's internal DNS follows backend container IP changes after an update.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream speedtest_backend {
    zone speedtest_backend 64k;
    server speedtest:8080 resolve;
}

server {
    listen 80;
    server_name speedtest.qpxq.net;
    return 308 https://speedtest.qpxq.net$request_uri;
}

server {
    listen 443 ssl;
    server_name speedtest.qpxq.net;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Streaming uploads/downloads must not be buffered, cached or compressed.
    client_max_body_size 0;
    client_body_timeout 300s;
    send_timeout 300s;
    gzip off;

    location / {
        proxy_pass http://speedtest_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Client-IP "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
